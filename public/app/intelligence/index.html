<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisdo Intelligence Workspace</title><style>body{margin:0;background:#050910;color:#f4f8ff;font-family:Inter,Arial}.wrap{max-width:1300px;margin:auto;padding:24px}.hero,.card{background:linear-gradient(145deg,#0d1929,#07101c);border:1px solid #21344d;border-radius:22px;padding:22px;box-shadow:0 20px 70px #0008}.hero h1{font-size:clamp(36px,6vw,76px);line-height:.9;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.card{grid-column:span 4}.wide{grid-column:span 8}.full{grid-column:span 12}.k{color:#5df2a2;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}.metric{font-size:40px;font-weight:900}textarea,input{width:100%;box-sizing:border-box;background:#07111f;border:1px solid #28425f;color:white;border-radius:12px;padding:13px;margin:10px 0}button{background:#5df2a2;color:#03120a;border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.log{white-space:pre-wrap;color:#a9bbd2;max-height:360px;overflow:auto}@media(max-width:850px){.card,.wide{grid-column:span 12}}</style></head><body><div class="wrap"><section class="hero"><div class="k">Wisdo Master Kernel · Phase 2–8</div><h1>Living intelligence.<br>Real execution.</h1><p>Intent, Digital Twin, memory, behavior planning, workspace control, explanations and Voice Presence share one live correlation trail.</p></section><div class="grid"><section class="card wide"><div class="k">Universal intent</div><textarea id="intent" rows="4" placeholder="Example: Show Deadshot on gold, or pause every bot in Growth Lane."></textarea><button onclick="sendIntent()">Plan live action</button><pre id="out" class="log"></pre></section><section class="card"><div class="k">Digital Twin</div><div class="metric" id="components">—</div><p>Online components</p><div class="metric" id="bots">—</div><p>Online bots</p><button onclick="loadTwin()">Refresh live state</button></section><section class="card full"><div class="k">Operating memory</div><input id="memory" placeholder="Teach Wisdo a durable preference or observation"><button onclick="remember()">Remember</button></section></div></div><script>const token=localStorage.getItem('wisdo_device_token')||'';const device=localStorage.getItem('wisdo_device_id')||'';async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'content-type':'application/json','authorization':'Bearer '+token,'x-wisdo-device-id':device,...(opt.headers||{})}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={error:t}}if(!r.ok)throw Error(j.error||r.statusText);return j}async function sendIntent(){try{out.textContent=JSON.stringify(await api('/api/kernel/v1/intents',{method:'POST',body:JSON.stringify({text:intent.value,execute:true})}),null,2)}catch(e){out.textContent=e.message}}async function loadTwin(){try{const j=await api('/api/kernel/v1/digital-twin');components.textContent=j.twin.health.components_online;bots.textContent=j.twin.health.bots_online}catch(e){out.textContent=e.message}}async function remember(){try{out.textContent=JSON.stringify(await api('/api/kernel/v1/memory',{method:'POST',body:JSON.stringify({content:memory.value,type:'preference'})}),null,2)}catch(e){out.textContent=e.message}}loadTwin()</script></body></html>
