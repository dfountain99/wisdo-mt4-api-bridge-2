<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisdo Voice Studio</title><style>:root{color-scheme:dark;font-family:Inter,system-ui;background:#030711;color:#eef8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#18375c 0,#07101e 35%,#02050a 72%)}main{max-width:1180px;margin:auto;padding:40px 20px 80px}.hero,.panel,.voice{border:1px solid #23435d;border-radius:24px;background:rgba(7,18,32,.84);box-shadow:0 20px 70px #0008}.hero{padding:34px}.eyebrow{color:#74ddff;letter-spacing:.24em;font-size:12px;font-weight:800}.hero h1{font-size:clamp(40px,7vw,80px);margin:10px 0}.hero p{color:#9bb4c5;max-width:800px;font-size:18px}.panel{margin-top:18px;padding:22px}textarea{width:100%;min-height:130px;border-radius:18px;border:1px solid #2a506c;background:#040b14;color:#fff;padding:18px;font-size:17px}button{border:0;border-radius:999px;padding:13px 19px;font-weight:800;cursor:pointer;background:#78e3ff;color:#001018;margin:10px 8px 0 0}.secondary{background:#172737;color:#d8f2ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}.voice{padding:20px}.voice h3{margin:0 0 8px}.meta{color:#8faabd;font-size:14px}.status{margin-top:14px;color:#74f3b0;white-space:pre-wrap}.active{outline:2px solid #f7d66d}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#102337;color:#aeeaff;font-size:12px;margin:4px}</style></head><body><main><section class="hero"><div class="eyebrow">WISDO PRESENCE LAB</div><h1>Describe a presence.<br>Wisdo builds the voice.</h1><p>No provider IDs, code, speed values, or configuration files. Describe the voice naturally, preview three directions, refine with conversation, and activate it across authorized devices.</p></section><section class="panel"><h2>Create by conversation</h2><textarea id="description">Create an original older Black New Orleans mentor voice. Deep warm baritone, slow and wise, relaxed Gulf South rhythm, light natural slang, and no robotic delivery.</textarea><button onclick="design()">Build three voices</button><div id="status" class="status"></div><div id="voices" class="grid"></div></section></main><script>const state={token:localStorage.wisdoDeviceToken||'',device:localStorage.wisdoDeviceId||'wisdo-office-pi'};function headers(json=true){const h={'Authorization':'Bearer '+state.token,'X-Wisdo-Device-Id':state.device};if(json)h['Content-Type']='application/json';return h}async function design(){status.textContent='Designing voice variations…';const r=await fetch('/api/voice/v2/design',{method:'POST',headers:headers(),body:JSON.stringify({description:description.value})});const j=await r.json();if(!r.ok){status.textContent=j.error||'Voice design failed. Add your enrolled device token to localStorage.wisdoDeviceToken.';return}status.textContent=j.summary;voices.innerHTML='';j.variants.forEach(v=>voices.insertAdjacentHTML('beforeend',`<article class="voice" id="v-${v.profile_id}"><h3>${v.name}</h3><div class="meta">${v.provider_voice} · speed ${v.speed}</div><span class="pill">${v.traits.register}</span><span class="pill">${v.traits.cadence}</span><span class="pill">${v.traits.accent}</span><br><button onclick="preview('${v.profile_id}')">Preview</button><button class="secondary" onclick="activate('${v.profile_id}')">Make default</button></article>`))})}async function preview(id){status.textContent='Generating natural preview…';const r=await fetch(`/api/voice/v2/profiles/${id}/preview`,{method:'POST',headers:headers(),body:JSON.stringify({text:'Aight, I’m with you. Your Wisdo ecosystem is steady, and we ain’t got to rush the next move.'})});if(!r.ok){status.textContent='Natural preview failed. Check device authorization and cloud TTS configuration.';return}new Audio(URL.createObjectURL(await r.blob())).play();status.textContent='Preview playing.'}async function activate(id){const r=await fetch(`/api/voice/v2/profiles/${id}/activate`,{method:'POST',headers:headers(),body:JSON.stringify({scope:{type:'user_default'}})});const j=await r.json();status.textContent=r.ok?'Voice activated. Connected devices will synchronize automatically.':j.error||'Activation failed.';if(r.ok)document.getElementById('v-'+id).classList.add('active')}</script></body></html>
