<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WISDO World</title>
<style>
html,body,#renderCanvas{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a;touch-action:none;font-family:Inter,system-ui,sans-serif}
#renderCanvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff}.top{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;gap:12px}
.panel{background:linear-gradient(180deg,rgba(8,13,24,.88),rgba(3,6,12,.72));border:1px solid rgba(212,175,55,.34);box-shadow:0 12px 40px #0008,inset 0 0 24px #d4af3710;backdrop-filter:blur(14px);border-radius:14px;padding:12px 15px}
.brand{font-weight:900;letter-spacing:.18em;color:#f1d36b}.sub{font-size:11px;opacity:.68;margin-top:3px}.stats{display:flex;gap:18px;font-size:12px}.stats b{display:block;color:#f1d36b;font-size:15px}
.bottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px}.chip{padding:8px 12px;border-radius:999px;background:#050a13cc;border:1px solid #ffffff18;font-size:11px}
#prompt{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);display:none}.district{position:absolute;left:18px;bottom:18px;min-width:220px}
#loading{position:fixed;inset:0;background:#02040a;display:grid;place-items:center;z-index:5;color:#f1d36b;letter-spacing:.2em;font-weight:800}
@media(max-width:700px){.stats{display:none}.bottom{width:92%;justify-content:center;flex-wrap:wrap}.district{bottom:88px}.top{left:10px;right:10px;top:10px}}
.forge{position:absolute;left:50%;bottom:34px;transform:translateX(-50%) translateY(24px);width:min(760px,92vw);opacity:0;transition:.7s;pointer-events:auto}.forge.show{opacity:1;transform:translateX(-50%) translateY(0)}.architect{font-size:16px;line-height:1.45;margin-bottom:10px}.forgeRow{display:flex;gap:8px}.forge input{flex:1;background:#030711e8;color:white;border:1px solid #d4af3766;border-radius:14px;padding:15px 17px;font-size:16px;outline:none}.forge button,.mini{background:#d4af37;color:#080808;border:0;border-radius:12px;padding:0 18px;font-weight:900;cursor:pointer}.genesisTools{position:absolute;right:18px;bottom:18px;display:flex;gap:7px;pointer-events:auto}.mini{padding:9px 12px;background:#080d18dd;color:#f1d36b;border:1px solid #d4af3744}.selection{position:absolute;right:18px;top:92px;font-size:10px;letter-spacing:.12em;opacity:.7}
</style>
</head>
<body>
<div id="loading">ENTERING WISDO</div><canvas id="renderCanvas"></canvas>
<div class="hud">
 <div id="selection" class="selection">GENESIS • NO OBJECT SELECTED</div>
 <div class="top"><div class="panel"><div class="brand">WISDO</div><div class="sub">CONNECT • COPY • CONTROL</div></div>
 <div class="panel stats"><span>ACCOUNT<b id="account">LINKING</b></span><span>EQUITY<b id="equity">—</b></span><span>WORLD<b id="worldState">LIVE</b></span></div></div>
 <div class="panel district"><div class="brand" id="district">THE COMMONS</div><div class="sub" id="districtSub">LIVE WISDO ECOSYSTEM</div></div>
 <div class="panel" id="prompt">E • INTERACT</div>
 <div id="forge" class="forge panel"><div class="brand"><span id="worldName">YOUR WORLD</span> · <span id="revision">REV 1</span></div><div id="architectText" class="architect">What world do you want to create?</div><div class="forgeRow"><input id="forgeInput" maxlength="1200" placeholder="Build me a medieval FPS world at night…"><button id="forgeSend">CREATE</button></div></div>
 <div class="genesisTools"><button class="mini" id="undo">UNDO</button><button class="mini" id="redo">REDO</button></div>
 <div class="bottom"><div class="chip">WISDO WORLD FORGE</div><div class="chip">TALK • TYPE • CREATE</div></div>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="/app/world/babylon-city/fidelity.js?v=2026.09.17.2"></script>
<script src="/app/world/babylon-city/character-runtime.js?v=2026.09.17.2"></script>
<script src="/app/world/babylon-city/visual-acceptance.js?v=2026.09.17.2"></script>
<script>
(async()=>{const entry=(new URLSearchParams(location.search).get('entry')||'').toLowerCase();const forceGenesis=entry==='genesis';try{const r=await fetch('/api/world/dna',{credentials:'include'});if(r.ok){const j=await r.json();if(forceGenesis||(j.dna&&!j.dna.architect?.onboardingComplete)){const s=document.createElement('script');s.src='/app/world/babylon-city/genesis.js?v=2026.09.22.2';document.body.appendChild(s);return}}}catch{}if(forceGenesis){document.getElementById('loading').textContent='WORLD DNA UNAVAILABLE';return}const s=document.createElement('script');s.src='/app/world/babylon-city/world.js?v=2026.09.17.2';document.body.appendChild(s)})();
</script>
</body></html>
