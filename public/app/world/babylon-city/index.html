<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WISDO City</title>
<style>
html,body,#renderCanvas{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a;touch-action:none;font-family:Inter,system-ui,sans-serif}
#renderCanvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff}.top{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;gap:12px}
.panel{background:linear-gradient(180deg,rgba(8,13,24,.88),rgba(3,6,12,.72));border:1px solid rgba(212,175,55,.34);box-shadow:0 12px 40px #0008,inset 0 0 24px #d4af3710;backdrop-filter:blur(14px);border-radius:14px;padding:12px 15px}
.brand{font-weight:900;letter-spacing:.18em;color:#f1d36b}.sub{font-size:11px;opacity:.68;margin-top:3px}.stats{display:flex;gap:18px;font-size:12px}.stats b{display:block;color:#f1d36b;font-size:15px}
.bottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px}.chip{padding:8px 12px;border-radius:999px;background:#050a13cc;border:1px solid #ffffff18;font-size:11px}
#prompt{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);display:none}.district{position:absolute;left:18px;bottom:18px;min-width:220px}
#loading{position:fixed;inset:0;background:#02040a;display:grid;place-items:center;z-index:5;color:#f1d36b;letter-spacing:.2em;font-weight:800}
@media(max-width:700px){.stats{display:none}.bottom{width:92%;justify-content:center;flex-wrap:wrap}.district{bottom:88px}.top{left:10px;right:10px;top:10px}}
</style>
</head>
<body>
<div id="loading">ENTERING WISDO CITY</div><canvas id="renderCanvas"></canvas>
<div class="hud">
 <div class="top"><div class="panel"><div class="brand">WISDO CITY</div><div class="sub">CONNECT • COPY • CONTROL</div></div>
 <div class="panel stats"><span>ACCOUNT<b id="account">LINKING</b></span><span>EQUITY<b id="equity">—</b></span><span>WORLD<b id="worldState">LIVE</b></span></div></div>
 <div class="panel district"><div class="brand" id="district">CENTRAL PLAZA</div><div class="sub" id="districtSub">WISDO WORLD NETWORK</div></div>
 <div class="panel" id="prompt">E • INTERACT</div>
 <div class="bottom"><div class="chip">WASD MOVE</div><div class="chip">SHIFT RUN</div><div class="chip">M MAP</div><div class="chip">E INTERACT</div><div class="chip">DRAG LOOK</div></div>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="/app/world/babylon-city/fidelity.js?v=2026.09.17.2"></script>
<script src="/app/world/babylon-city/character-runtime.js?v=2026.09.17.2"></script>
<script src="/app/world/babylon-city/visual-acceptance.js?v=2026.09.17.2"></script>
<script src="/app/world/babylon-city/world.js?v=2026.09.17.2"></script>
</body></html>
