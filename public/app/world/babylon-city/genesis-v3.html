<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WISDO Genesis</title>
<style>
*{box-sizing:border-box}html,body,#renderCanvas{width:100%;height:100%;margin:0;overflow:hidden;background:#01030a;color:#fff;font-family:Inter,system-ui,sans-serif}#renderCanvas{position:fixed;inset:0;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none}.glass{background:linear-gradient(135deg,#071221d9,#02050bbf);border:1px solid #35a8ff55;box-shadow:0 16px 60px #000b,inset 0 0 30px #138cff10;backdrop-filter:blur(18px);border-radius:18px}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand{padding:13px 16px}.logo{font-weight:1000;letter-spacing:.24em;color:#e8c75c}.tiny{font-size:9px;letter-spacing:.15em;color:#83c9ff;margin-top:5px}.badge{padding:10px 13px;font-size:9px;letter-spacing:.13em;color:#8ed3ff}
.mode{position:absolute;left:14px;top:94px;padding:12px;width:185px}.mode b{display:block;color:#65beff;letter-spacing:.14em;font-size:10px;margin-bottom:8px}.meter{height:5px;background:#ffffff10;border-radius:8px;overflow:hidden}.meter i{display:block;width:12%;height:100%;background:#55baff;box-shadow:0 0 14px #55baff}.mode small{display:block;margin-top:8px;color:#ffffff88}
.ideas{position:absolute;top:96px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;flex-wrap:wrap;gap:7px;width:min(600px,58vw)}.ideas span{padding:7px 10px;border:1px solid #38aaff66;border-radius:999px;background:#041326cc;color:#9dd8ff;font-size:9px;letter-spacing:.12em;box-shadow:0 0 22px #168cff30}
.lenses{position:absolute;right:14px;top:94px;padding:10px;display:grid;gap:6px;pointer-events:auto}.lenses button,.actions button{border:1px solid #ffffff18;background:#07101bd9;color:#a8cce8;border-radius:10px;padding:9px 11px;font-size:9px;letter-spacing:.09em}.lenses button.active{border-color:#42b7ff;color:#fff;box-shadow:inset 0 0 18px #168cff22}
.architect{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(820px,94vw);padding:14px;pointer-events:auto}.wisdo{display:flex;gap:10px;align-items:center;margin-bottom:10px}.orb{width:29px;height:29px;border-radius:50%;background:#198cff;box-shadow:0 0 25px #198cff}.speech{font-size:13px;color:#dcefff}.inputrow{display:flex;gap:8px}.inputrow input{flex:1;background:#010714;color:#fff;border:1px solid #35a8ff55;border-radius:13px;padding:14px;font-size:15px;outline:none}.inputrow button{border:0;border-radius:13px;padding:0 18px;background:linear-gradient(135deg,#e5c35c,#9f791c);font-weight:900}.actions{display:flex;gap:6px;margin-top:8px;overflow:auto}.actions .forge{margin-left:auto;border-color:#d6b64d66;color:#d6b64d}
.legend{position:absolute;left:14px;bottom:135px;font-size:9px;line-height:1.8;color:#ffffff78}.blue{color:#54baff}.gold{color:#e5c35c}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#01030a;z-index:9;color:#e5c35c;letter-spacing:.2em;font-weight:900}
@media(max-width:700px){.lenses{display:none}.mode{top:82px;width:145px}.ideas{top:84px;width:55vw}.legend{display:none}.badge{max-width:160px}.architect{bottom:8px}.actions{padding-bottom:2px}}
</style></head><body><div id="loading" class="loading">OPENING GENESIS CHAMBER</div><canvas id="renderCanvas"></canvas><div class="ui">

<div class="glass mode"><b>WORLD BLUEPRINT</b><div class="meter"><i id="readiness"></i></div><small id="stage">IDEA • 12% READY</small></div>
<div id="ideaCloud" class="ideas"></div>
<div class="glass lenses"><button class="active">WORLD</button><button>GEOGRAPHY</button><button>CITIES</button><button>TECH</button><button>SPACE</button><button>SIMULATE</button></div>
<div class="legend"><span class="blue">● BLUE</span> proposed<br><span class="gold">● GOLD</span> approved<br>● PHYSICAL forged</div>

</div><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="/app/world/babylon-city/genesis-v3.js?v=2026.09.22.1"></script></body></html>
