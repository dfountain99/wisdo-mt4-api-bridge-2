<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#02040a">

<title>WISDO World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}
#worldFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#02040a}
#legacy{position:fixed;right:12px;bottom:12px;z-index:20;font:600 10px system-ui;color:#9aa7b8;text-decoration:none;background:#07101ccc;border:1px solid #ffffff18;border-radius:999px;padding:7px 10px;opacity:.5}

</style>
</head>
<body>
<iframe id="worldFrame" title="WISDO World" src="about:blank" allow="fullscreen; autoplay; gamepad" referrerpolicy="same-origin"></iframe>
<script>
(()=>{const p=new URLSearchParams(location.search);const scene=(p.get('scene')||'central').toLowerCase();if(scene==='genesis'){document.getElementById('worldFrame').src='/app/world/babylon-city/genesis-v4.html';return}if(scene==='personal'){document.getElementById('worldFrame').src='/app/world/babylon-city/personal-world-v1.html';return}document.getElementById('worldFrame').src='/app/world/babylon-city/?entry=production-v1'})();
</script>
<a id="legacy" href="/app/world/legacy.html">LEGACY WORLD</a>
</body>
