<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#02040a">
<meta name="description" content="WISDO Aether — playable social game universe.">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>WISDO Aether</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}#worldFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#02040a}#legacy{position:fixed;right:12px;bottom:12px;z-index:20;font:600 10px system-ui;color:#9aa7b8;text-decoration:none;background:#07101ccc;border:1px solid #ffffff18;border-radius:999px;padding:7px 10px;opacity:.5}#legacy:hover{opacity:1}</style>
</head><body>
<iframe id="worldFrame" title="WISDO Aether" src="about:blank" allow="fullscreen; autoplay; gamepad" referrerpolicy="same-origin"></iframe>
<script>
(()=>{const p=new URLSearchParams(location.search);const scene=(p.get('scene')||'lobby').toLowerCase(),frame=document.getElementById('worldFrame');
if(scene==='lobby'||scene==='home'){frame.src='/app/world/aether-lobby/';return}
if(scene==='city'){frame.src='/app/world/legacy.html';return}
if(scene==='genesis'){frame.src='/app/world/babylon-city/genesis-v4.html';return}
if(scene==='unreal'){frame.src='/app/world/babylon-city/unreal-session.html';return}
if(scene==='personal'){frame.src='/app/world/babylon-city/personal-world-v1.html';return}
frame.src='/app/world/babylon-city/?entry=production-v1'})();
</script>
<a id="legacy" href="/app/world/legacy.html">LEGACY WORLD</a>
</body></html>
