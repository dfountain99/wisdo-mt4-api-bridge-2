<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HIGHTOWER Server Control</title>
<style>body{font:16px system-ui;background:#101217;color:#f2f0e8;max-width:760px;margin:40px auto;padding:20px}h1{color:#e7bf69}label{display:block;margin:18px 0 6px}input,select,button{box-sizing:border-box;padding:13px;border:1px solid #555;border-radius:8px;background:#20242d;color:inherit;font:inherit}input,select{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button{cursor:pointer}button:disabled{opacity:.5}pre{padding:16px;background:#20242d;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9bec9}</style>
<h1>HIGHTOWER Server Control</h1><p>Control the paired bot on its exact chart and magic number.</p><small>Keep MT4 running. The bot starts paused; Resume allows its existing strategy to trade. Direction changes and close commands leave it paused.</small>
<label for="account">Account</label><select id="account"></select><label for="symbol">Exact broker symbol</label><input id="symbol" value="XAUUSD" maxlength="24"><label for="magic">EA magic number</label><input id="magic" type="number" value="26080204" min="1" max="2147483647">
<div class="actions" id="actions"></div><pre id="status" role="status">Loading your accounts…</pre>
<script>
const status=document.querySelector('#status'),buttons=document.querySelector('#actions');
const actions={PAUSE:'Pause entries',RESUME:'Resume strategy',BUY_ONLY:'Buy only',SELL_ONLY:'Sell only',AUTO_DIRECTION:'Auto direction',MANAGE_ONLY:'Manage only',CLOSE_ALL:'Close bot trades',CLOSE_PROFITS:'Close profitable trades',EMERGENCY_STOP:'Emergency stop + close',RESET_EMERGENCY:'Reset emergency'};
async function request(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Request failed');return j;}
for(const [action,label] of Object.entries(actions)){const b=document.createElement('button');b.textContent=label;b.onclick=()=>send(action);buttons.append(b);}
let receiptTimer;
async function send(action){clearTimeout(receiptTimer);buttons.querySelectorAll('button').forEach(b=>b.disabled=true);try{const body={accountId:document.querySelector('#account').value,symbol:document.querySelector('#symbol').value.trim(),magicNumber:Number(document.querySelector('#magic').value),action};const p=await request('/api/wisdo/hightower/command',body);if(!confirm(`${actions[action]}?\nAccount: ${p.preview.accountNumber}\nSymbol: ${p.preview.symbol}\nMagic: ${p.preview.magicNumber}`))return;const q=await request('/api/wisdo/hightower/command',{...body,confirmed:true});status.textContent='Queued. Waiting for the EA to execute. Command: '+q.commandId;await receipt(q.commandId,Date.now()+150000);}catch(e){status.textContent=e.message;}finally{buttons.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function receipt(id,deadline){try{const r=await request('/api/wisdo/hightower/receipt/'+encodeURIComponent(id));status.textContent=JSON.stringify(r,null,2);if(['pending','delivered'].includes(r.status)&&Date.now()<deadline)receiptTimer=setTimeout(()=>receipt(id,deadline),2000);}catch(e){status.textContent=e.message;}}
request('/api/wisdo/hightower/accounts').then(r=>{const select=document.querySelector('#account');for(const a of r.accounts){const o=document.createElement('option');o.value=a.accountId;o.textContent=a.accountNumber+' · '+a.brokerServer;select.append(o);}status.textContent=r.accounts.length?'Select the account, exact chart symbol, and magic number. Pair the EA before sending commands.':'No owned accounts. Pair your copier first.';}).catch(e=>status.textContent=e.message);
</script></html>
