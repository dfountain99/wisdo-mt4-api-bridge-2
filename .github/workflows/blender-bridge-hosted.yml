name: WISDO Blender Bridge Hosted

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: wisdo-blender-bridge
  cancel-in-progress: false

jobs:
  bridge:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BLENDER JOB]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      WISDO_BLENDER_GITHUB_TOKEN: ${{ github.token }}
      WISDO_BLENDER_REPO: ${{ github.repository }}
      WISDO_BLENDER_AGENT_ID: github-hosted-${{ github.run_id }}
      WISDO_BLENDER_RUN_TESTS: 'true'
    steps:
      - name: Checkout WISDO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version | head -n 1
          blender -b --python-expr "import numpy; print('WISDO_NUMPY', numpy.__version__)"

      - name: Configure Git identity
        run: |
          git config --global user.name "WISDO Blender Bridge"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Detect Blender
        run: node tools/blender/detect_blender.mjs

      - name: Process one Blender job
        run: node tools/blender/bridge/agent.mjs --once
