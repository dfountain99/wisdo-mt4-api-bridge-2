name: four-pillar-operational-contracts

on:
  push:
    paths:
      - 'services/wisdoFourPillarOperations.js'
      - 'server/fourPillarRoutes.js'
      - 'server/kernelRouteRegistry.js'
      - 'scripts/migratePostgres.js'
      - 'migrations/2026-11-13-four-pillar-operations.sql'
      - 'tests/fourPillarOperations.test.js'
      - 'desktop-agent/**'
      - 'pi-edge/sentinel_bridge.py'
      - 'pi-edge/wisdo_edge.py'
      - 'pi-edge/enroll.py'
      - '.github/workflows/four-pillar-ci.yml'
  pull_request:
    paths:
      - 'services/wisdoFourPillarOperations.js'
      - 'server/fourPillarRoutes.js'
      - 'server/kernelRouteRegistry.js'
      - 'scripts/migratePostgres.js'
      - 'migrations/2026-11-13-four-pillar-operations.sql'
      - 'tests/fourPillarOperations.test.js'
      - 'desktop-agent/**'
      - 'pi-edge/sentinel_bridge.py'
      - 'pi-edge/wisdo_edge.py'
      - 'pi-edge/enroll.py'
      - '.github/workflows/four-pillar-ci.yml'

permissions:
  contents: read

concurrency:
  group: four-pillars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  four-pillars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Node source syntax
        run: |
          node --check services/wisdoFourPillarOperations.js
          node --check server/fourPillarRoutes.js
          node --check server/kernelRouteRegistry.js
      - name: Test four-pillar runtime behavior
        run: node --test tests/fourPillarOperations.test.js
      - name: Validate edge and agent source syntax
        run: |
          python -m compileall -q desktop-agent/agent.py desktop-agent/enroll.py pi-edge/sentinel_bridge.py pi-edge/wisdo_edge.py pi-edge/enroll.py
