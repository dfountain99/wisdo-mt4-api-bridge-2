name: WISDO Launch Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wisdo-launch-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:secrets
      - run: node scripts/buildWorldLab.mjs
        if: github.event_name == 'pull_request'
        env:
          WORLD_LAB_PR: ${{ github.event.pull_request.number }}
          WORLD_LAB_TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      - run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {createHash} from 'node:crypto'; const m=JSON.parse(readFileSync('.world-lab-dist/build.json')); const fixture=readFileSync('.world-lab-dist/app/world/fixtures/golden-world.json'); if(m.commit!==process.env.WORLD_LAB_TARGET_SHA || m.manifestHash!==createHash('sha256').update(fixture).digest('hex')) process.exit(1)"
        if: github.event_name == 'pull_request'
        env:
          WORLD_LAB_TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      - run: npm run lint
      - run: npm run test:security
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:commands
      - run: npm run smoke
      - run: npm test
      - run: npm run check
      - run: npm run audit:runtime
      - run: npm run audit:commands
      - run: npm run audit:stubs
