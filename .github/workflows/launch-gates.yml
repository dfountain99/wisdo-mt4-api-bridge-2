name: WISDO Launch Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wisdo-launch-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:secrets
      - run: npm run lint
      - run: npm run test:security
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:commands
      - run: npm run smoke
      - run: npm test
      - run: npm run check
      - run: npm run audit:runtime
      - run: npm run audit:commands
      - run: npm run audit:stubs
